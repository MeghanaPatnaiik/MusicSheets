services:
  backend:
    build: ./backend
    container_name: musicsheets-backend-compose
    image: anahpatnaik/musicsheets-backend:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"

  
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: musicsheets-frontend-compose
    image: anahpatnaik/musicsheets-frontend:${IMAGE_TAG:-latest}
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
